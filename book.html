
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Book Appointment</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="container">
        <h1>Book Appointment</h1>

        <section class="card">
            <h2>{{ slot.service_name }}</h2>
            <p>Date: {{ slot.slot_date }}</p>
            <p>Time: {{ slot.start_time }} – {{ slot.end_time }}</p>

            <form method="POST">
                <label for="customer_name">Your name</label>
                <input id="customer_name" name="customer_name"
                       maxlength="100" required>

                <label for="customer_email">Email address</label>
                <input id="customer_email" name="customer_email"
                       type="email" maxlength="150" required>

                <button type="submit">Confirm booking</button>
            </form>
        </section>

        <a href="{{ url_for('index') }}">Back to slots</a>
    </main>
</body>
</html>
